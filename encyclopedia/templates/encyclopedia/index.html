{% extends "encyclopedia/layout.html" %}

{% block title %}All Pages{% endblock %}

{% block body %}
    <h1>All Pages</h1>

    {% if entries %}
        <ul>
            {% for entry in entries %}
                <li>
                    <a>{{ entry }}</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>There are no encyclopedia entries yet. <a>Create one!</a></p>
    {% endif %}
{% endblock %}
