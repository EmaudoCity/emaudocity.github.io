{% extends "encyclopedia/layout.html" %}

{% block title %}Create New Page{% endblock %}

{% block body %}
    <h1>Create New Page</h1>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form class="editor" action="{% url 'encyclopedia:new' %}" method="post">
        {% csrf_token %}
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ title_value|default:'' }}" placeholder="Entry title">

        <label for="content">Markdown Content</label>
        <textarea id="content" name="content" rows="15" placeholder="Write your entry in Markdown...">{{ content_value|default:'' }}</textarea>

        <button type="submit">Save Page</button>
    </form>
{% endblock %}
