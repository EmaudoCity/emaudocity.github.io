<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Advanced Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="advanced-header">
        <div class="mini-logo">
            <span class="b1">G</span><span class="b2">o</span><span class="b3">o</span><span class="b4">g</span><span class="b5">l</span><span class="b6">e</span>
        </div>
        <div class="topnav">
            <a href="index.html">Search</a>
        </div>
    </div>

    <div class="advanced-title">Advanced Search</div>
    <hr class="advanced-rule">

    <form class="advanced-form" action="https://www.google.com/search" method="GET" name="f">
        <div class="field">
            <div class="label">Find pages with… “all these words:”</div>
            <input type="text" name="as_q">
        </div>
        <div class="field">
            <div class="label">Find pages with… “this exact word or phrase:”</div>
            <input type="text" name="as_epq">
        </div>
        <div class="field">
            <div class="label">Find pages with… “any of these words:”</div>
            <input type="text" name="as_oq">
        </div>
        <div class="field">
            <div class="label">Find pages with… “none of these words:”</div>
            <input type="text" name="as_eq">
        </div>
    </form>

    <div class="advanced-submit-row">
        <input type="submit" class="adv-btn" value="Advanced Search" form="f">
    </div>
</body>
</html>
