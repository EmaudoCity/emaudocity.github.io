{% extends "encyclopedia/layout.html" %}

{% block title %}{{ title }}{% endblock %}

{% block body %}
    <div class="entry-header">
        <h1>{{ title }}</h1>
        <a class="button" href="{% url 'encyclopedia:edit' title %}">Edit Page</a>
    </div>

    <div class="entry-content">
        {{ content|safe }}
    </div>
{% endblock %}
