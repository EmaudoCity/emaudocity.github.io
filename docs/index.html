<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="topnav">
        <a href="image-search.html">Images</a>
        <a href="advanced-search.html">Advanced Search</a>
    </div>

    <main class="search-main">
        <div class="logo">
            <span class="b1">G</span><span class="b2">o</span><span class="b3">o</span><span class="b4">g</span><span class="b5">l</span><span class="b6">e</span>
        </div>

        <form class="search-form" action="https://www.google.com/search" method="GET">
            <input type="text" name="q" class="search-bar" aria-label="Google search" autocomplete="off">

            <div class="buttons">
                <input type="submit" class="btn" value="Google Search" name="btnK">
                <input type="submit" class="btn" value="I'm Feeling Lucky" name="btnI">
            </div>
        </form>
    </main>
</body>
</html>
